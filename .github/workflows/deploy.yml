name: Deploy to FastHosts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP to FastHosts
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: sftp.colchester-rangers-fc.co.uk
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}
          exclude: |
            **/.git*/
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            .env
            .venv/
            venv/
